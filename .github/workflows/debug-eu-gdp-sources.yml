name: Debug EU GDP Sources

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-eu-gdp-sources
  cancel-in-progress: true

jobs:
  debug-gdp:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Run EU GDP source diagnostics
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u debug_eu_gdp_sources.py

      - name: Print GDP summary
        if: always()
        run: |
          if [ -f debug/eu_gdp_sources/gdp_debug_summary.md ]; then
            cat debug/eu_gdp_sources/gdp_debug_summary.md
          else
            echo "GDP debug summary was not generated."
          fi

      - name: Upload EU GDP debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-gdp-source-debug-${{ github.run_number }}
          path: debug/eu_gdp_sources/
          retention-days: 7
          if-no-files-found: warn
