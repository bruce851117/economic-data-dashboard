name: Debug EU Macro Official Sources

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-eu-macro-official-sources
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Fetch latest six official observations
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u debug_eu_macro_sources.py

      - name: Upload EU source debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-macro-official-source-debug-${{ github.run_number }}
          path: debug/eu_macro_sources/
          retention-days: 14
          if-no-files-found: error
