name: Debug EU macro sources

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-eu-macro-sources
  cancel-in-progress: false

jobs:
  debug-eu-macro-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests openpyxl

      - name: Compare EU_ECON with official sources
        run: |
          python debug_eu_macro_sources.py \
            --xlsx EU_ECON.xlsx \
            --out debug/eu_macro_sources
        env:
          GENESIS_TOKEN: ${{ secrets.GENESIS_TOKEN }}

      - name: Upload EU source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-macro-source-diagnostics-${{ github.run_number }}
          path: debug/eu_macro_sources/
          if-no-files-found: warn
          retention-days: 14
