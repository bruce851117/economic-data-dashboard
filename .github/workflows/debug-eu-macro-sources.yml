name: Debug EU structured macro sources

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-eu-structured-sources
  cancel-in-progress: false

jobs:
  debug-eu-structured-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 openpyxl xlrd urllib3

      - name: Compare structured official sources with EU_ECON values
        run: |
          python debug_eu_structured_sources.py \
            --out debug/eu_structured_sources

      - name: Upload structured-source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-structured-source-diagnostics-${{ github.run_number }}
          path: debug/eu_structured_sources/
          if-no-files-found: warn
          retention-days: 14
