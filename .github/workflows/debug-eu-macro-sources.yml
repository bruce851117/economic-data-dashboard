name: Debug remaining EU structured sources

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-eu-remaining-structured-sources
  cancel-in-progress: false

jobs:
  debug-eu-remaining-structured-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 openpyxl xlrd pypdf urllib3

      - name: Validate remaining structured official sources
        env:
          GENESIS_TOKEN: ${{ secrets.GENESIS_TOKEN }}
          GENESIS_USERNAME: ${{ secrets.GENESIS_USERNAME }}
          GENESIS_PASSWORD: ${{ secrets.GENESIS_PASSWORD }}
        run: |
          python debug_eu_remaining_structured_sources.py \
            --out debug/eu_remaining_structured_sources

      - name: Upload remaining-source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-remaining-structured-source-diagnostics-${{ github.run_number }}
          path: debug/eu_remaining_structured_sources/
          if-no-files-found: warn
          retention-days: 14
