name: Update UK macro and debug EU sources

on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-macro-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pypdf openpyxl

      - name: Update UK macro data
        run: python update_uk_macro.py

      - name: Compare EU_ECON with official sources
        if: always()
        run: python debug_eu_macro_sources.py --xlsx EU_ECON.xlsx --out debug/eu_macro_sources
        env:
          GENESIS_TOKEN: ${{ secrets.GENESIS_TOKEN }}

      - name: Upload EU source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-macro-source-diagnostics-${{ github.run_number }}
          path: debug/eu_macro_sources/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit updated UK data and EU diagnostics
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/uk_macro.json debug/eu_macro_sources/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update UK macro data and EU source diagnostics"
            git push
          fi
