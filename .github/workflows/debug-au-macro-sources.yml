name: Debug AU Macro Sources

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-au-macro-sources
  cancel-in-progress: true

jobs:
  validate-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check requests beautifulsoup4 openpyxl pypdf

      - name: Validate Australian macro sources
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u debug_au_macro_sources_v2.py

      - name: Print source comparison
        if: always()
        run: |
          if [ -f debug/au_macro_sources/au_source_comparison.csv ]; then
            cat debug/au_macro_sources/au_source_comparison.csv
          else
            echo "AU source comparison was not generated."
          fi

      - name: Upload AU source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: au-macro-source-debug-${{ github.run_number }}
          path: debug/au_macro_sources/
          retention-days: 7
          if-no-files-found: warn
