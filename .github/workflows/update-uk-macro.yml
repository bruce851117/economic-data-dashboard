name: Update UK Macro Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 1,6,11,16,21,26 * *"


permissions:
  contents: write

concurrency:
  group: update-uk-macro-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf openpyxl

      - name: Update all available UK data
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/update_uk_macro.py

      - name: Upload UK source debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uk-macro-source-debug-${{ github.run_number }}
          path: debug/uk_macro_sources/
          retention-days: 7
          if-no-files-found: warn

      - name: Commit changes
        run: |
          if git diff --quiet -- data/uk_macro.json; then
            echo "No new or revised UK data."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/uk_macro.json
          git commit -m "Update UK macro data"
          git push
