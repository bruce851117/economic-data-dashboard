name: Update US macro table

on:
  workflow_dispatch:
  schedule:
    - cron: "20 14 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-us-macro-table
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl xlrd requests playwright

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build US macro Markdown
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python scripts/fetch_us_macro_table.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/us_macro_table.md \
            data/us_macro_cache.json \
            data/us_macro_debug/

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "Update US macro table"
          git push