name: Update US Macro Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1,6,11,16,21,26 * *"

permissions:
  contents: write

concurrency:
  group: update-us-macro-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check pandas openpyxl xlrd requests

      - name: Update all available US data
        env:
          PYTHONUNBUFFERED: "1"
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python -u scripts/update_us_macro.py

      - name: Commit changes
        run: |
          if git diff --quiet -- data/us_macro.json; then
            echo "No new or revised US data."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us_macro.json
          git commit -m "Update US macro data"
          git push
