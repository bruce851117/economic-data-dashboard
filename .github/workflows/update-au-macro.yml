name: Update AU Macro Data

on:
  workflow_dispatch:


permissions:
  contents: write

concurrency:
  group: update-au-macro-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check requests beautifulsoup4 openpyxl xlrd pypdf

      - name: Update Australian macro data
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/update_au_macro.py

      - name: Print debug markdown preview
        if: always()
        run: |
          if [ -f au_macro_all_data.md ]; then
            sed -n '1,240p' au_macro_all_data.md
          else
            echo "au_macro_all_data.md was not generated."
          fi

      - name: Commit updated data and debug table
        run: |
          if git diff --quiet -- data/au_macro.json au_macro_all_data.md; then
            echo "No AU macro changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/au_macro.json au_macro_all_data.md
          git commit -m "Update AU macro data"
          git push

      - name: Upload AU update diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: au-macro-update-${{ github.run_number }}
          path: |
            debug/au_macro_sources/
            au_macro_all_data.md
          retention-days: 7
          if-no-files-found: warn
